<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <radialGradient id="ambientGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientGlow2" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <!-- Icon Gradients -->
    <linearGradient id="iconBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="iconBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="iconShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.3"/>
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#ambientGlow1)"/>
  <rect width="1200" height="420" rx="16" fill="url(#ambientGlow2)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Border Highlight -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="url(#iconBorderGrad)" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Ambient Light Streak Top -->
  <line x1="200" y1="1" x2="1000" y2="1" stroke="url(#brandGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Left: App Icon (macOS Squircle) -->
  <g transform="translate(100, 110)" filter="url(#iconShadow)">
    <!-- Squircle base -->
    <rect width="200" height="200" rx="46" fill="url(#iconBaseGrad)"/>
    <rect width="200" height="200" rx="46" fill="none" stroke="url(#iconBorderGrad)" stroke-width="2"/>
    
    <!-- Subtle Inner Bevel -->
    <rect width="194" height="194" x="3" y="3" rx="43" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

    <!-- App Graphic: Modern Geometric Forge & Aperture -->
    <circle cx="100" cy="100" r="65" fill="#3B82F6" fill-opacity="0.15" filter="url(#glowEffect)"/>

    <!-- Image Frame Backing -->
    <rect x="46" y="46" width="108" height="108" rx="20" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 2" stroke-opacity="0.6"/>
    
    <!-- Top Piston (Compressing Down) -->
    <path d="M 64 62 L 136 62 L 126 78 L 74 78 Z" fill="url(#textGrad)" opacity="0.9"/>
    <!-- Downward Compression Arrows -->
    <path d="M 100 82 L 100 96 M 94 90 L 100 96 L 106 90" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center Gem / Anvil Core with Radiant Energy -->
    <polygon points="100,102 124,116 124,142 100,156 76,142 76,116" fill="url(#brandGrad)" opacity="0.85"/>
    <polygon points="100,102 124,116 100,128 76,116" fill="#FFFFFF" opacity="0.4"/>
    <polygon points="100,128 124,116 124,142 100,156" fill="#000000" opacity="0.2"/>

    <!-- Core Sparkle -->
    <circle cx="100" cy="128" r="4" fill="#FFFFFF" filter="url(#glowEffect)"/>
    
    <!-- Base Anvil Plate -->
    <rect x="58" y="152" width="84" height="6" rx="3" fill="#64748B" opacity="0.8"/>
  </g>

  <!-- Right: Typography & Highlights -->
  <g transform="translate(350, 105)">
    <!-- Tagline Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="28" rx="14" fill="#1E293B" fill-opacity="0.8" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#10B981"/>
      <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="0.8">
        LOCAL-FIRST MACOS UTILITY
      </text>
    </g>

    <!-- Project Title -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.2">
      ImageForge
    </text>

    <!-- Subtitle -->
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94A3B8" letter-spacing="-0.2">
      Blazing-fast batch image compressor &amp; JPG converter for macOS.
    </text>

    <!-- Highlights Badges Row 1 -->
    <g transform="translate(0, 150)">
      <!-- Pill 1: 100% Offline -->
      <g transform="translate(0, 0)">
        <rect width="168" height="34" rx="8" fill="#172033" stroke="#2563EB" stroke-opacity="0.4" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#93C5FD">
          ⚡ 100% On-Device
        </text>
      </g>

      <!-- Pill 2: Zero Telemetry -->
      <g transform="translate(178, 0)">
        <rect width="186" height="34" rx="8" fill="#172033" stroke="#4F46E5" stroke-opacity="0.4" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#C7D2FE">
          🛡️ Zero Cloud / Analytics
        </text>
      </g>

      <!-- Pill 3: Dimension Invariant -->
      <g transform="translate(374, 0)">
        <rect width="198" height="34" rx="8" fill="#172033" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#DDD6FE">
          📐 Dimension Invariant
        </text>
      </g>

      <!-- Pill 4: Non-Destructive -->
      <g transform="translate(582, 0)">
        <rect width="166" height="34" rx="8" fill="#172033" stroke="#059669" stroke-opacity="0.4" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#A7F3D0">
          🔒 Non-Destructive
        </text>
      </g>
    </g>

    <!-- Highlights Badges Row 2: Codecs -->
    <g transform="translate(0, 196)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.5">
        NATIVE ENGINES:
      </text>

      <g transform="translate(112, 0)">
        <rect width="98" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">
          libjpeg-turbo
        </text>
      </g>

      <g transform="translate(218, 0)">
        <rect width="68" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">
          oxipng
        </text>
      </g>

      <g transform="translate(294, 0)">
        <rect width="70" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">
          libwebp
        </text>
      </g>

      <g transform="translate(372, 0)">
        <rect width="68" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">
          libheif
        </text>
      </g>

      <g transform="translate(448, 0)">
        <rect width="130" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="10" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">
          Tauri 2 + Svelte 5
        </text>
      </g>
    </g>
  </g>
</svg>
