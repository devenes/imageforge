name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (svelte-check)
        run: pnpm check

      - name: Build frontend (Vite)
        run: pnpm build

  backend:
    name: Rust Backend Quality & Tests
    runs-on: macos-14
    env:
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system native dependencies (Homebrew)
        run: |
          brew update --preinstall
          brew install jpeg-turbo libwebp libheif cmake nasm pkg-config

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache-workspaces: true

      - name: Check code formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Lint code with Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --all-targets -- --nocapture

  build-check:
    name: Native App Build Verification
    needs: [frontend, backend]
    runs-on: macos-14
    env:
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system native dependencies (Homebrew)
        run: |
          brew install jpeg-turbo libwebp libheif cmake nasm pkg-config

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application binary (Tauri --no-bundle)
        run: pnpm tauri build --no-bundle
