name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_dmg:
        description: 'Build and upload unsigned ARM64 DMG artifact'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (svelte-check)
        run: pnpm check

      - name: Build frontend (Vite)
        run: pnpm build

  backend:
    name: Rust Backend Quality & Tests
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system native dependencies (Homebrew)
        run: |
          brew install jpeg-turbo webp libheif cmake nasm pkgconf

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache-workspaces: true

      - name: Create placeholder frontend dist directory
        run: mkdir -p dist && touch dist/index.html

      - name: Check code formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Lint code with Clippy
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets -- --nocapture

  build-check:
    name: Native App Build Verification
    needs: [frontend, backend]
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system native dependencies (Homebrew)
        run: |
          brew install jpeg-turbo webp libheif cmake nasm pkgconf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application binary (Tauri --no-bundle)
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          pnpm tauri build --no-bundle

  build-unsigned-dmg:
    name: Build unsigned ARM64 DMG
    if: github.event_name == 'workflow_dispatch' && (inputs.build_dmg == true || inputs.build_dmg == 'true')
    needs: [frontend, backend]
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system native dependencies (Homebrew)
        run: |
          brew install jpeg-turbo webp libheif cmake nasm pkgconf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache-workspaces: true

      - name: Run build_release.sh
        run: ./scripts/build_release.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageForge-aarch64-dmg
          path: dist/*.dmg
          if-no-files-found: error
